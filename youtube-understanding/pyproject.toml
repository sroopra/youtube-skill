[project]
name = "youtube-understanding"
version = "0.1.0"
description = "Agent Skill: transcript-first YouTube video understanding (dev/test project; runtime uses scripts/yt.py PEP 723 metadata)."
requires-python = ">=3.11"
# Keep in sync with the PEP 723 block in scripts/yt.py.
dependencies = [
    "yt-dlp[default,deno,curl-cffi]==2026.10.26",
    "youtube-transcript-api==1.2.4",
    "google-genai==2.34.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"
