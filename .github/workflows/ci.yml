name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: youtube-understanding
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Tests use fakes: no network, no paid calls.
      - run: uv run --locked pytest -q
      - run: uvx --from skills-ref==0.1.1 agentskills validate "$PWD"
